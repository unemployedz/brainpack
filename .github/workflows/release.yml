name: Publish BrainPack release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: "0.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const m=require("./manifest.json"); if (m.version !== process.env.RELEASE_VERSION) { console.error("manifest.json version does not match requested release"); process.exit(1); }'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" main.js manifest.json styles.css \
            --title "$RELEASE_VERSION" \
            --notes "BrainPack $RELEASE_VERSION beta release. Install with Obsidian BRAT using unemployedz/brainpack."
